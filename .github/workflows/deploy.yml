name: Deploy Studiogrid Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: studiogrid-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: 91.107.155.106
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"studiogrid/deploy","description":"Starting Python SSH deployment"}' >/dev/null

      - name: Validate deployment secret
        id: validate
        continue-on-error: true
        run: test -n "$SSHPASS"

      - name: Prepare deploy archive
        id: archive
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        run: |
          tar --exclude='.git' --exclude='.github' -czf /tmp/studiogrid.tar.gz .
          test -s /tmp/studiogrid.tar.gz

      - name: Install Python SSH library
        id: pyssh
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          try:
              import paramiko
              print('paramiko already installed')
          except ImportError:
              raise SystemExit(1)
          PY

      - name: Install Paramiko fallback
        id: pip
        if: steps.archive.outcome == 'success' && steps.pyssh.outcome != 'success'
        continue-on-error: true
        run: timeout 90 python -m pip install --disable-pip-version-check -q paramiko

      - name: Test SSH and upload
        id: upload
        if: steps.archive.outcome == 'success' && (steps.pyssh.outcome == 'success' || steps.pip.outcome == 'success')
        continue-on-error: true
        env:
          PASS: ${{ secrets.PASS }}
        run: |
          python - <<'PY'
          import os, socket, sys, paramiko
          host=os.environ['HOST']; password=os.environ['PASS']
          socket.create_connection((host,22),12).close()
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(host, username='root', password=password, timeout=15, banner_timeout=15, auth_timeout=15, allow_agent=False, look_for_keys=False)
          sftp=c.open_sftp(); sftp.put('/tmp/studiogrid.tar.gz','/tmp/studiogrid.tar.gz'); sftp.close()
          stdin,stdout,stderr=c.exec_command("mkdir -p /var/www/studiogrid && find /var/www/studiogrid -mindepth 1 -maxdepth 1 -exec rm -rf {} + && tar -xzf /tmp/studiogrid.tar.gz -C /var/www/studiogrid", timeout=90)
          rc=stdout.channel.recv_exit_status(); err=stderr.read().decode()
          c.close()
          if rc: print(err); sys.exit(rc)
          print('SSH authentication and upload succeeded')
          PY

      - name: Configure web server
        id: nginx
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          PASS: ${{ secrets.PASS }}
        run: |
          python - <<'PY'
          import os, sys, paramiko
          host=os.environ['HOST']; password=os.environ['PASS']
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(host, username='root', password=password, timeout=15, auth_timeout=15, allow_agent=False, look_for_keys=False)
          cmd=r'''set -e
          if ! command -v nginx >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            timeout 180 apt-get update -qq
            timeout 180 apt-get install -y -qq nginx
          fi
          mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
          install -m 0644 /var/www/studiogrid/deploy/nginx.conf /etc/nginx/sites-available/studiogrid
          ln -sfn /etc/nginx/sites-available/studiogrid /etc/nginx/sites-enabled/studiogrid
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable nginx >/dev/null 2>&1 || true
          systemctl restart nginx
          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            ufw allow 80/tcp >/dev/null || true
            ufw allow 443/tcp >/dev/null || true
          fi
          curl -fsS --max-time 10 http://127.0.0.1/ -H 'Host: studiogrid.smarbiz.sbs' >/dev/null
          echo WEB_OK'''
          stdin,stdout,stderr=c.exec_command(cmd, timeout=240)
          out=stdout.read().decode(); err=stderr.read().decode(); rc=stdout.channel.recv_exit_status(); c.close()
          print(out)
          if rc: print(err); sys.exit(rc)
          PY

      - name: Public HTTP smoke test
        id: smoke
        if: steps.nginx.outcome == 'success'
        continue-on-error: true
        run: curl -fsS --retry 4 --retry-delay 2 --connect-timeout 8 --max-time 15 http://"$HOST"/ -H 'Host: studiogrid.smarbiz.sbs' >/dev/null

      - name: Configure HTTPS when DNS is ready
        id: https
        if: steps.nginx.outcome == 'success'
        continue-on-error: true
        env:
          PASS: ${{ secrets.PASS }}
        run: |
          python - <<'PY'
          import os, sys, paramiko
          host=os.environ['HOST']; password=os.environ['PASS']
          c=paramiko.SSHClient(); c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(host, username='root', password=password, timeout=15, auth_timeout=15, allow_agent=False, look_for_keys=False)
          cmd=r'''set -e
          RESOLVED=$(getent ahostsv4 studiogrid.smarbiz.sbs 2>/dev/null | awk 'NR==1{print $1}')
          if [ "$RESOLVED" != "91.107.155.106" ]; then
            echo "DNS_PENDING:$RESOLVED"
            exit 0
          fi
          if ! command -v certbot >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            timeout 180 apt-get update -qq
            timeout 180 apt-get install -y -qq certbot python3-certbot-nginx
          fi
          certbot --nginx -d studiogrid.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect
          echo HTTPS_OK'''
          stdin,stdout,stderr=c.exec_command(cmd, timeout=300)
          out=stdout.read().decode(); err=stderr.read().decode(); rc=stdout.channel.recv_exit_status(); c.close()
          print(out)
          if rc: print(err); sys.exit(rc)
          PY

      - name: Report final deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ steps.validate.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          PYSSH: ${{ steps.pyssh.outcome }}
          PIP: ${{ steps.pip.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          NGINX: ${{ steps.nginx.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          HTTPS: ${{ steps.https.outcome }}
        run: |
          STATE=success; DESC='Studiogrid deployed'; STAGE=success
          if [ "$VALIDATE" != "success" ]; then STATE=failure; DESC='FAILED: PASS secret'; STAGE=secrets;
          elif [ "$ARCHIVE" != "success" ]; then STATE=failure; DESC='FAILED: deploy archive'; STAGE=archive;
          elif [ "$PYSSH" != "success" ] && [ "$PIP" != "success" ]; then STATE=failure; DESC='FAILED: Python SSH library'; STAGE=tools;
          elif [ "$UPLOAD" != "success" ]; then STATE=failure; DESC='FAILED: SSH authentication/upload'; STAGE=ssh;
          elif [ "$NGINX" != "success" ]; then STATE=failure; DESC='FAILED: nginx/server configuration'; STAGE=nginx;
          elif [ "$SMOKE" != "success" ]; then STATE=failure; DESC='Server configured; public port 80 blocked'; STAGE=network;
          elif [ "$HTTPS" != "success" ]; then STATE=success; DESC='HTTP live; HTTPS setup pending'; STAGE=https; fi
          URL="https://github.com/${{ github.repository }}/actions?stage=$STAGE"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"studiogrid/deploy\",\"description\":\"$DESC\",\"target_url\":\"$URL\"}" >/dev/null
          [ "$STATE" = success ] || exit 1
