name: Deploy Studiogrid Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: studiogrid-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"studiogrid/deploy","description":"Deploying demo to production"}' >/dev/null

      - name: Install deploy tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Validate deployment secrets
        run: |
          test -n "$HOST" || (echo "Missing HOST secret" && exit 1)
          test -n "$SSHPASS" || (echo "Missing PASS secret" && exit 1)

      - name: Prepare server
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /var/www/studiogrid /etc/nginx/sites-available /etc/nginx/sites-enabled'

      - name: Upload demo
        run: |
          sshpass -e rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            ./ root@"$HOST":/var/www/studiogrid/
          sshpass -e scp -o StrictHostKeyChecking=no deploy/nginx.conf root@"$HOST":/tmp/studiogrid-nginx.conf

      - name: Configure nginx and HTTPS
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -e
          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
          fi
          install -m 0644 /tmp/studiogrid-nginx.conf /etc/nginx/sites-available/studiogrid
          ln -sfn /etc/nginx/sites-available/studiogrid /etc/nginx/sites-enabled/studiogrid
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable nginx >/dev/null 2>&1 || true
          systemctl restart nginx

          if ! test -d /etc/letsencrypt/live/studiogrid.smarbiz.sbs; then
            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot python3-certbot-nginx
            fi
            certbot --nginx -d studiogrid.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
          fi
          REMOTE

      - name: Smoke test
        run: |
          sleep 3
          curl --fail --retry 5 --retry-delay 2 --max-time 15 http://"$HOST"/ -H 'Host: studiogrid.smarbiz.sbs' >/dev/null
          echo "Studiogrid demo deployed successfully."

      - name: Report final deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; DESC='Studiogrid demo deployed'; else STATE=failure; DESC='Studiogrid deployment failed'; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$STATE\",\"context\":\"studiogrid/deploy\",\"description\":\"$DESC\"}" >/dev/null
