name: Studiogrid Server Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      HOST: 91.107.155.106
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Checkout diag branch
        uses: actions/checkout@v4
        with:
          ref: diag-temp
          fetch-depth: 0

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Collect diagnostics
        run: |
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' > server-diagnostics.txt 2>&1 <<'REMOTE'
          set +e
          echo '=== DATE ==='; date -Is
          echo '=== HOST ==='; hostname; hostname -I
          echo '=== NGINX ==='; systemctl is-active nginx; nginx -t 2>&1
          echo '=== LISTENERS ==='; ss -ltnp | grep -E ':(22|80|443)\b'
          echo '=== LOCAL HTTP ==='; curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1/ -H 'Host: studiogrid.smarbiz.sbs'
          echo '=== LOCAL HTTPS ==='; curl -ksS -o /dev/null -w '%{http_code}\n' https://127.0.0.1/ -H 'Host: studiogrid.smarbiz.sbs'
          echo '=== UFW ==='; ufw status verbose 2>&1 || true
          echo '=== IPTABLES ==='; iptables -S 2>&1 || true
          echo '=== NFT ==='; nft list ruleset 2>&1 || true
          echo '=== FAIL2BAN ==='; fail2ban-client status 2>&1 || true
          echo '=== NGINX ERROR LOG ==='; tail -n 100 /var/log/nginx/error.log 2>&1 || true
          echo '=== NGINX ACCESS LOG ==='; tail -n 100 /var/log/nginx/access.log 2>&1 || true
          REMOTE

      - name: Save diagnostics to diag branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server-diagnostics.txt
          git commit -m 'Update server diagnostics' || true
          git push origin HEAD:diag-temp
