server {
    listen 80;
    listen [::]:80;
    server_name studiogrid.smarbiz.sbs;

    root /var/www/studiogrid;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studiogrid.smarbiz.sbs;

    ssl_certificate /etc/nginx/ssl/studiogrid.crt;
    ssl_certificate_key /etc/nginx/ssl/studiogrid.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/studiogrid;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
